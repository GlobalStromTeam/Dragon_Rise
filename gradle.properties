# ForgeGradle 在应用插件时会向 https://maven.minecraftforge.net/ 和
# https://libraries.minecraft.net/ 各发一次不设超时的 HEAD 请求来"检查证书"。
# 本机访问这两个域名会挂住（TLS 握手阶段），导致每次构建的配置阶段随机多等几十秒到数分钟。
# 关掉这个自检（只是连通性自检，不影响真正的依赖下载）。
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.check.certs=false
# 常驻守护进程：省掉每次构建的 JVM 启动 + 全量配置（实测每次 10~18s）
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.4.0,)
loader_version_range=[47,)

mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

mod_id=dragonrise_reforge
mod_name=DragonRise:Reforge
mod_license=MIT
mod_version=1.5.1-20261113
mod_group_id=com.redabysslucia

mod_authors=red_abyss_lucia, CJY2, LY01, boy1145141919810, twosomebody, LOL_141, CHINACAT_2025, XingYu
