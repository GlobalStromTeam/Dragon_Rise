pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'dragonrise_reforge'

// ---------------------------------------------------------------- 离线解析
// 本机对 maven.parchmentmc.org 的【动态版本】元数据校验经常失败，一旦失败整包解析就挂：
//   Plugin [id: 'org.parchmentmc.librarian.forgegradle', version: '1.+'] was not found
// 而所有依赖其实都已在 Gradle 缓存里，所以默认走离线解析（等价于命令行加 --offline），
// IDEA 的 Gradle 任务窗口也一起受益（它走 Tooling API，没法通过 gradlew.bat 传参）。
// 真需要联网拉新依赖时：命令行加 --refresh-dependencies 不会生效，请先设环境变量 DR_ONLINE=1。
if (System.getenv('DR_ONLINE') == null) {
    gradle.startParameter.offline = true
}
